org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---------------------------------------------------------------------------
# SaifAI Builder — app config. Yahan apni values daalo (ya local.properties
# me same keys daal do, wahan se bhi read hota hai).
# ---------------------------------------------------------------------------

# GitHub repo jispe .github/workflows/build.yml hai
GITHUB_OWNER=shahudgg
GITHUB_REPO=SaifAI-Builder
GITHUB_WORKFLOW=build.yml
GITHUB_BRANCH=main

# Firebase Realtime Database URL (jaha workflow download link likhta hai)
# Example: https://saifai-builder-default-rtdb.firebaseio.com
FIREBASE_DB_URL=

# Ad-gate landing page (web/download.html ko host karke uska URL yahan daalo).
# Blank chhodoge to seedha Drive/browser link khulega.
AD_GATE_URL=

# Optional: apna "Saif" server jaha APK upload karna hai (multipart POST).
# Blank = skip, sirf Drive/Firebase link use hoga.
SAIF_UPLOAD_URL=
SAIF_API_KEY=

name: SaifAI Auto Builder Master

# ---------------------------------------------------------------------------
# SaifAI Builder <-> App Gateway contract v1 (see docs/GATEWAY_CONTRACT.md)
#
# Existing repo secret/variable NAMES kept as-is to avoid re-work:
#   secrets.GCP_CREDENTIALS    Google service-account JSON (needs both scopes:
#                              drive.file + firebase.database; see docs)
#   secrets.GDRIVE_FOLDER_ID   Private Drive folder that receives artifacts
#   secrets.FIREBASE_DB_URL    RTDB origin only, e.g. https://<db>.firebaseio.com
#                              (NOT .../apps.json - the root SDK URL)
# New names this contract expects (owner must create, names only):
#   vars.SAIF_DOWNLOAD_PORTAL_URL        e.g. https://saifai-downloads.ai.studio
#   vars.SAIF_CLOUD_API_BASE_URL         gateway API base (default callback URL = <base>/api/build-complete)
#   secrets.SAIF_GATEWAY_CALLBACK_TOKEN  random shared key, used ONLY as the
#                                        HMAC key for signed completion callbacks
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'App Name / User Prompt'
        required: true
        default: 'Saif_AI_Test_App'
      job_id:
        description: 'Gateway job id (private, staged by the app/backend dispatch). Empty for manual runs.'
        required: false
        default: ''
      callback_url:
        description: 'Signed completion callback URL supplied by the gateway. Empty = use vars.SAIF_CLOUD_API_BASE_URL/api/build-complete'
        required: false
        default: ''
      artifact_types:
        description: 'Space separated subset of: apk zip video'
        type: choice
        default: 'apk zip video'
        options:
          - 'apk zip video'
          - 'apk'
          - 'apk zip'
          - 'zip'
          - 'video'

permissions:
  contents: read

concurrency:
  group: saifai-builder
  cancel-in-progress: false

jobs:
  build-upload-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PROMPT: ${{ github.event.inputs.prompt }}
      JOB_ID: ${{ github.event.inputs.job_id }}
      CALLBACK_URL_INPUT: ${{ github.event.inputs.callback_url }}
      ARTIFACT_TYPES: ${{ github.event.inputs.artifact_types }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
      SAIF_GATEWAY_CALLBACK_TOKEN: ${{ secrets.SAIF_GATEWAY_CALLBACK_TOKEN }}
      PORTAL_BASE: ${{ vars.SAIF_DOWNLOAD_PORTAL_URL }}
      API_BASE: ${{ vars.SAIF_CLOUD_API_BASE_URL }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate inputs and secrets (names checked, values never logged)
        id: gate
        run: |
          set -euo pipefail
          [[ "$PROMPT" =~ ^[a-zA-Z0-9][a-zA-Z0-9\ _.-]{0,63}$ ]] || { echo "::error::prompt contains unsupported characters"; exit 1; }
          [ -z "$JOB_ID" ] || [[ "$JOB_ID" =~ ^[a-zA-Z0-9-]{6,64}$ ]] || { echo "::error::job_id must be 6-64 chars [a-zA-Z0-9-]"; exit 1; }
          [ -z "$CALLBACK_URL_INPUT" ] || [[ "$CALLBACK_URL_INPUT" =~ ^https:// ]] || { echo "::error::callback_url must be https"; exit 1; }
          ok=true
          for kv in GCP_CREDENTIALS GDRIVE_FOLDER_ID FIREBASE_DB_URL; do
            v="${!kv}"
            if [ -z "$v" ]; then echo "::error title=Missing secret::Secret $kv is not set on this repo (Settings > Secrets and variables > Actions)"; ok=false; fi
          done
          [ "$ok" = true ] || exit 1
          SAFE_NAME=$(printf '%s' "$PROMPT" | tr ' ' '_' | tr -cd 'a-zA-Z0-9._-')
          RUN_TAG="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          echo "run_tag=$RUN_TAG" >> "$GITHUB_OUTPUT"
          CB="$CALLBACK_URL_INPUT"
          if [ -z "$CB" ] && [ -n "$API_BASE" ]; then CB="${API_BASE%/}/api/build-complete"; fi
          echo "callback_url=$CB" >> "$GITHUB_OUTPUT"
          DB_BASE=$(printf '%s' "$FIREBASE_DB_URL" | sed -E 's#(https://[^/]+).*#\1#')
          echo "db_base=$DB_BASE" >> "$GITHUB_OUTPUT"
          echo "All required secret NAMES resolve. Values are never printed."

      - name: Build Artifacts (apks, project zip, demo video)
        id: build
        run: |
          set -euo pipefail
          mkdir -p output
          NAME="${{ steps.gate.outputs.safe_name }}"
          TAG="${{ steps.gate.outputs.run_tag }}"
          want(){ [[ " $ARTIFACT_TYPES " == *" $1 "* ]]; }
          if want apk; then
            # Placeholder until the real Antigravity engine lands. NEVER embed credentials here.
            printf 'Saif AI Builder placeholder APK %s %s\n' "$NAME" "$TAG" > "output/${NAME}-${TAG}.apk"
          fi
          if want zip; then
            STAGE=$(mktemp -d); mkdir -p "$STAGE/project"
            printf '# %s\nGenerated by Saif AI Builder (job %s)\n' "$NAME" "${JOB_ID:-manual}" > "$STAGE/project/README.md"
            (cd "$STAGE/project" && zip -qr "$OLDPWD/output/${NAME}-${TAG}-project.zip" .)
            rm -rf "$STAGE"
          fi
          if want video; then
            if command -v ffmpeg >/dev/null 2>&1; then
              ffmpeg -hide_banner -loglevel error -f lavfi -i "color=size=640x360:duration=3:rate=24:color=black" \
                -vf "drawtext=text='${NAME}':fontcolor=white:fontsize=36:x=(w-text_w)/2:y=(h-text_h)/2" \
                -pix_fmt yuv420p -y "output/${NAME}-${TAG}-demo.mp4"
            else
              echo "::warning::ffmpeg unavailable; emitting placeholder video file"
              printf 'video placeholder %s %s\n' "$NAME" "$TAG" > "output/${NAME}-${TAG}-demo.mp4"
            fi
          fi
          ls -la output/

      - name: Google auth (Drive + RTDB REST)
        id: auth
        uses: google-github-actions/auth@v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: >-
            https://www.googleapis.com/auth/drive.file
            https://www.googleapis.com/auth/firebase.database
            https://www.googleapis.com/auth/userinfo.email

      - name: Upload artifacts to private Drive folder (multipart, no third-party action)
        id: drive
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          FOLDER="$GDRIVE_FOLDER_ID"
          declare -A IDS
          for f in output/*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            meta=$(jq -cn --arg n "$base" --arg p "$FOLDER" '{name:$n, parents:[$p]}')
            resp=$(curl -sfS -X POST "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name" \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -F "metadata=$meta;type=application/json" \
              -F "file=@$f;type=application/octet-stream")
            fid=$(printf '%s' "$resp" | jq -r '.id')
            [ -n "$fid" ] && [ "$fid" != "null" ] || { echo "::error::Drive upload failed for $base"; exit 1; }
            case "$base" in
              *.apk)  IDS[apk]="$fid"  ;;
              *.zip)  IDS[zip]="$fid"  ;;
              *.mp4)  IDS[video]="$fid";;
            esac
            echo "uploaded_drive_id[$base]=$fid" >> "$GITHUB_STEP_SUMMARY"
          done
          [ -n "${IDS[apk]:-}" ]   && echo "apk_id=${IDS[apk]}"     >> "$GITHUB_OUTPUT"
          [ -n "${IDS[zip]:-}" ]   && echo "zip_id=${IDS[zip]}"     >> "$GITHUB_OUTPUT"
          [ -n "${IDS[video]:-}" ] && echo "video_id=${IDS[video]}" >> "$GITHUB_OUTPUT"
          # Files stay PRIVATE: no permissions are created, no public 'uc?id=' links are produced.

      - name: Mint one-time download token (never logged unmasked)
        id: token
        run: |
          set -euo pipefail
          TOKEN="$(openssl rand -hex 24)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          if [ -n "$PORTAL_BASE" ]; then
            echo "portal_url=${PORTAL_BASE%/}/d/$TOKEN" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::vars.SAIF_DOWNLOAD_PORTAL_URL not set; portal_url output will be empty"
          fi

      - name: Sync one-time token via authenticated RTDB REST (private paths, not /apps.json)
        if: steps.drive.outputs.apk_id != '' || steps.drive.outputs.zip_id != ''
        env:
          ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: |
          set -euo pipefail
          DB="${{ steps.gate.outputs.db_base }}"
          TOKEN="${{ steps.token.outputs.token }}"
          JID="${JOB_ID:-manual-${GITHUB_RUN_ID}}"
          body=$(jq -cn \
            --arg token "$TOKEN" \
            --arg job "$JID" \
            --arg name "$PROMPT" \
            --arg apk "${{ steps.drive.outputs.apk_id }}" \
            --arg zip "${{ steps.drive.outputs.zip_id }}" \
            --arg video "${{ steps.drive.outputs.video_id }}" \
            --arg run "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            '{token:$token, jobId:$job, appName:$name, files:{apk:$apk, zip:$zip, video:$video}, used:false, createdAt:{".sv":"timestamp"}, runUrl:$run}')
          curl -sfS -X PUT -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$body" "$DB/downloadTokens/$TOKEN.json" \
            || { echo "::error::RTDB write failed. Grant the service account roles/firebasedatabase.admin (or an RTDB-scoped auth path) and check rules."; exit 1; }
          curl -sfS -X PATCH -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -cn --arg t "$TOKEN" --arg p "${{ steps.token.outputs.portal_url }}" '{status:"ready", token:$t, portalUrl:$p, updatedAt:{".sv":"timestamp"}}' )" \
            "$DB/jobs/$JID.json" || echo "::warning::jobs/ mirror write failed (non-fatal)"
          echo "One-time token + file ids synced under /downloadTokens/<token> (private paths only)."

      - name: Signed gateway completion callback
        if: always() && steps.gate.outputs.callback_url != ''
        env:
          STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          CB="${{ steps.gate.outputs.callback_url }}"
          [ -n "$SAIF_GATEWAY_CALLBACK_TOKEN" ] || { echo "::error::secrets.SAIF_GATEWAY_CALLBACK_TOKEN not set; signed callback aborted"; exit 1; }
          st=$([ "$STATUS" = "success" ] && echo completed || echo failed)
          body=$(jq -cn \
            --arg job "${JOB_ID:-}" \
            --arg st "$st" \
            --arg repo "$GITHUB_REPOSITORY" --arg run "$GITHUB_RUN_ID" \
            --arg portal "${{ steps.token.outputs.portal_url }}" \
            --arg apk "${{ steps.drive.outputs.apk_id }}" \
            --arg zip "${{ steps.drive.outputs.zip_id }}" \
            --arg video "${{ steps.drive.outputs.video_id }}" \
            '{schema:"saif-builder.callback/v1", jobId:$job, status:$st, portalUrl:$portal, files:{apk:$apk,zip:$zip,video:$video}, run:{repo:$repo, id:$run}}')
          sig=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SAIF_GATEWAY_CALLBACK_TOKEN" -r | awk '{print $1}')
          curl -sfS -X POST "$CB" -H "Content-Type: application/json" \
            -H "X-Saif-Signature: sha256=$sig" \
            -H "X-Saif-Job: ${JOB_ID:-manual}" \
            --retry 3 --retry-delay 5 -d "$body" \
            || { echo "::error::gateway callback failed at $CB (host unreachable or rejected)"; exit 1; }

      - name: Upload run artifacts (encrypted Actions artifact, kept as fallback)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.gate.outputs.safe_name }}-${{ steps.gate.outputs.run_tag }}
          path: output/
          retention-days: 14
          compression-level: 0

      - name: Result summary
        if: always()
        run: |
          {
            echo "### SaifAI Builder run"
            echo "- status: **${{ job.status }}**"
            echo "- job_id: \`${JOB_ID:-manual}\`"
            echo "- portal_url: ${{ steps.token.outputs.portal_url || '(not minted)' }}"
            echo "- callback: ${{ steps.gate.outputs.callback_url || '(none)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

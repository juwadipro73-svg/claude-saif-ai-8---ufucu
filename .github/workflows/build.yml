name: SaifAI Auto Builder Master

# ---------------------------------------------------------------------------
# REAL gateway contract (app repo PR #4 @ f29e032, owner-provided 2026-11-08)
# See docs/GATEWAY_CONTRACT.md. Earlier guessed v1 dispatch/callback/claim
# shapes have been removed entirely.
#
# Dispatch  : gateway sends workflow_dispatch with ONLY inputs.job_id (UUID).
# Stage     : worker reads gs://<SAIF_GCS_BUCKET>/jobs/<job_id>/input.json
#             {jobId, ownerUid, kind: apk|zip|video, prompt, project, assets[]}
#             and verifies every asset's size + SHA-256 before building.
# Callbacks : Authorization: Bearer WORKER_CALLBACK_SECRET
#             POST <SAIF_CLOUD_API_BASE_URL>/api/worker/progress {"jobId","status":"building"}
#             POST <SAIF_CLOUD_API_BASE_URL>/api/worker/complete {"jobId","status":"ready","driveFileId":...}
#                                                    or {"jobId","status":"failed","error":...}
# Gateway   : verifies the private Drive file itself, updates RTDB
#             cloudJobs/<jobId> and apps/<uid>/<jobId>, mints the claim token;
#             one-time link = /download/<jobId>#claim=<TOKEN> (portal side).
#             The worker NEVER writes RTDB, NEVER mints tokens, NEVER creates
#             public Drive links (/downloadTokens and /d/... do not exist here).
#
# Phone file upload (POST /api/push -> signed GCS PUT -> /api/push/complete ->
# private Drive -> one-time link) is a SEPARATE flow in the app/gateway; this
# workflow does not touch it.
#
# Required NAMES on this repo (owner reuse policy; secret-or-variable,
# secret checked first — values are never logged):
#   secrets GCP_CREDENTIALS, GDRIVE_FOLDER_ID, WORKER_CALLBACK_SECRET
#   SAIF_CLOUD_API_BASE_URL  (secret or variable)
#   SAIF_GCS_BUCKET          (secret or variable; fallback: GCS_BUCKET)
# GCP_CREDENTIALS service account needs: Drive folder Editor + storage.objectViewer
# on the jobs bucket. RTDB writes are gateway-side, so no firebase scope here.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Gateway job id — UUID; gateway staged jobs/<job_id>/input.json in private GCS'
        required: true

permissions:
  contents: read

concurrency:
  group: saifai-builder
  cancel-in-progress: false

jobs:
  build-upload-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JOB_ID: ${{ github.event.inputs.job_id }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
      WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
      SEC_SAIF_CLOUD_API_BASE_URL: ${{ secrets.SAIF_CLOUD_API_BASE_URL }}
      VAR_SAIF_CLOUD_API_BASE_URL: ${{ vars.SAIF_CLOUD_API_BASE_URL }}
      SEC_SAIF_GCS_BUCKET: ${{ secrets.SAIF_GCS_BUCKET }}
      VAR_SAIF_GCS_BUCKET: ${{ vars.SAIF_GCS_BUCKET }}
      SEC_GCS_BUCKET: ${{ secrets.GCS_BUCKET }}
      VAR_GCS_BUCKET: ${{ vars.GCS_BUCKET }}
      SAIF_STATE_DIR: ${{ runner.temp }}/saif-state
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate dispatch input + resolve required names (values never logged)
        id: validate
        run: bash scripts/10_validate.sh

      - name: Google auth (Drive upload + private GCS read)
        id: auth
        uses: google-github-actions/auth@v2.1.13
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          token_format: access_token
          access_token_lifetime: 600s
          access_token_scopes: >-
            https://www.googleapis.com/auth/drive.file
            https://www.googleapis.com/auth/devstorage.read_only

      - name: Fetch staged input.json from private GCS
        id: fetch
        env:
          SAIF_GCP_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: bash scripts/20_fetch_input.sh

      - name: Report progress to gateway (building)
        id: progress
        run: bash scripts/30_progress.sh

      - name: Verify staged assets (size + SHA-256)
        id: verify
        env:
          SAIF_GCP_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: bash scripts/40_verify_assets.sh

      - name: Build artifact for kind=apk|zip|video
        id: build
        run: bash scripts/50_build.sh

      - name: Upload artifact to private Drive folder
        id: upload
        env:
          SAIF_GCP_TOKEN: ${{ steps.auth.outputs.access_token }}
          ARTIFACT_PATH: ${{ steps.build.outputs.artifact_path }}
        run: bash scripts/60_drive_upload.sh

      - name: Completion callback to gateway (ready | failed)
        id: callback
        if: always() && steps.validate.outcome == 'success'
        env:
          JOB_STATUS: ${{ job.status }}
          DRIVE_FILE_ID: ${{ steps.upload.outputs.drive_file_id }}
          OUTCOMES: "validate=${{ steps.validate.outcome }},auth=${{ steps.auth.outcome }},fetch=${{ steps.fetch.outcome }},progress=${{ steps.progress.outcome }},verify=${{ steps.verify.outcome }},build=${{ steps.build.outcome }},upload=${{ steps.upload.outcome }}"
        run: bash scripts/90_callback_complete.sh

      - name: Keep encrypted Actions artifact as fallback
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-${{ github.event.inputs.job_id }}
          path: output/
          retention-days: 14
          if-no-files-found: warn

      - name: Run summary
        if: always()
        run: |
          {
            echo "### SaifAI Builder run"
            echo "- status: **${{ job.status }}**"
            echo "- job_id: \`${{ github.event.inputs.job_id }}\`"
            echo "- kind: \`${{ steps.fetch.outputs.kind || '(unfetched)' }}\`"
            echo "- assets verified: ${{ steps.verify.outputs.assets_verified || '0' }}"
            echo "- drive file delivered: \`${{ steps.upload.outputs.drive_file_id != '' && 'yes (private)' || 'no' }}\`"
            echo "- callback: ${{ steps.callback.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

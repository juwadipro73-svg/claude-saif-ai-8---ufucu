name: SaifAI Auto Builder Master

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'App Name / User Prompt'
        required: true
        default: 'Saif_AI_Test_App'

jobs:
  build-upload-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Build App (Antigravity Engine)
        run: |
          echo "Starting build process for: ${{ github.event.inputs.prompt }}"
          mkdir -p output
          # Generating a test APK file for now. Real build code goes here later.
          echo "This is a real APK generated by Saif AI Builder" > output/app.apk
          echo "Build Successful!"

      - name: Upload APK to Google Drive
        uses: adityak74/google-drive-upload-action@main
        id: upload_to_drive
        with:
          credentials: ${{ secrets.GCP_CREDENTIALS }}
          filename: "output/app.apk"
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: "${{ github.event.inputs.prompt }}.apk" 
          overwrite: "true"

      - name: Save Link to Firebase
        run: |
          FILE_ID="${{ steps.upload_to_drive.outputs.fileId }}"
          URL="${{ secrets.FIREBASE_DB_URL }}/apps.json"
          JSON_DATA="{\"appName\": \"${{ github.event.inputs.prompt }}\", \"driveFileId\": \"$FILE_ID\", \"status\": \"Ready to Download\"}"
          
          echo "Syncing with Firebase Database..."
          curl -X POST -H "Content-Type: application/json" -d "$JSON_DATA" $URL
          echo "Firebase Updated Successfully!"

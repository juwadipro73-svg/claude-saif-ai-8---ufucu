name: SaifAI Auto Builder Master

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: 'App Name / User Prompt'
        required: true
        default: 'Saif_AI_Test_App'

jobs:
  build-upload-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App (Antigravity Engine)
        run: |
          echo "Starting build process for: ${{ github.event.inputs.prompt }}"
          mkdir -p output
          # TODO: yahan real build aayega (Gradle assembleRelease).
          # Filhaal app flow test karne ke liye placeholder APK banate hain.
          echo "This is a real APK generated by Saif AI Builder" > output/app.apk
          echo "Build Successful!"

      - name: Upload APK to Google Drive
        id: upload_to_drive
        uses: adityak74/google-drive-upload-action@main
        with:
          credentials: ${{ secrets.GCP_CREDENTIALS }}
          filename: "output/app.apk"
          folderId: ${{ secrets.GDRIVE_FOLDER_ID }}
          name: "${{ github.event.inputs.prompt }}.apk"
          overwrite: "true"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.prompt }}-apk
          path: output/app.apk
          retention-days: 7

      - name: Save Link to Firebase
        env:
          PROMPT: ${{ github.event.inputs.prompt }}
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          FILE_ID: ${{ steps.upload_to_drive.outputs.fileId }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${FILE_ID}" ]; then
            echo "::error::Drive upload se fileId nahi mila — upload step fail hua."
            exit 1
          fi
          if [ -z "${FIREBASE_DB_URL}" ]; then
            echo "::error::Secret FIREBASE_DB_URL set nahi hai."
            exit 1
          fi

          # App jis key se padhta hai (Kotlin: lowercase + [^a-z0-9] -> _)
          APP_KEY=$(printf '%s' "${PROMPT}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/_/g')
          DOWNLOAD_URL="https://drive.google.com/uc?export=download&id=${FILE_ID}"

          PAYLOAD=$(jq -n \
            --arg name "${PROMPT}" \
            --arg key "${APP_KEY}" \
            --arg id "${FILE_ID}" \
            --arg url "${DOWNLOAD_URL}" \
            --arg run "${RUN_URL}" \
            '{appName:$name, appKey:$key, driveFileId:$id, downloadUrl:$url,
              runUrl:$run, status:"Ready to Download", createdAt:(now|todate)}')

          echo "Syncing with Firebase Database… -> /apps/${APP_KEY}.json"
          curl -sS -f -X PUT \
            -H "Content-Type: application/json" \
            -d "${PAYLOAD}" \
            "${FIREBASE_DB_URL%/}/apps/${APP_KEY}.json"
          echo ""
          echo "Firebase Updated Successfully!"

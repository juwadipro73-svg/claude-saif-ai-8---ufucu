name: SAIF AI private cloud builder
on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Private job UUID (issued by the authenticated gateway)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: saif-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      JOB_ID: ${{ inputs.job_id }}
      CLOUD_API_BASE_URL: ${{ vars.CLOUD_API_BASE_URL }}
      STAGING_BUCKET: ${{ secrets.STAGING_BUCKET }}
      DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
      WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DRIVE_CLIENT_ID: ${{ secrets.DRIVE_CLIENT_ID }}
      DRIVE_CLIENT_SECRET: ${{ secrets.DRIVE_CLIENT_SECRET }}
      DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
      GOOGLE_APPLICATION_CREDENTIALS: /tmp/saif-worker.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Gradle
        run: gradle --version
      - name: Install isolated worker dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Provision private staging credential
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          test -n "$SERVICE_ACCOUNT_JSON"
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Install Android SDK and FFmpeg for cloud builds
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          if command -v sdkmanager >/dev/null; then
            yes | sdkmanager --licenses >/dev/null || true
            sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          else
            echo 'Android SDK command-line tools are unavailable on this runner' >&2
            exit 1
          fi
      - name: Build/render, privately upload to Drive, and report Firebase status
        run: node scripts/worker.mjs "$JOB_ID"
      - name: Report runner setup failure
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          # The worker reports its own failures. If setup failed earlier, unblock the app status.
          curl --fail --silent --show-error -X POST "$CLOUD_API_BASE_URL/api/worker/complete" \
            -H "Authorization: Bearer $WORKER_CALLBACK_SECRET" -H 'Content-Type: application/json' \
            -d "{\"jobId\":\"$JOB_ID\",\"status\":\"failed\",\"error\":\"Cloud runner setup failed\"}"

name: Build Android APK
# Debug APKs are uploaded after compilation; only a passing test suite updates the prerelease.

# Every push to ANY branch starts a build by itself (main, arena/*, or the "new branch" GitHub makes for a web upload).
# Pushing/uploading code is enough - no need to press "Run workflow".
on:
  push:
    branches: [ "**" ]
    # The catalog sync commits telegram_catalog/*; that alone does not need a new APK.
    paths-ignore:
      - 'telegram_catalog/**'
  workflow_dispatch:

permissions:
  contents: write

# A newer push to the same branch cancels the older, still-running build (saves ~20 min of queue).
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloud-template-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test authenticated gateway and one-time private downloads
        run: cd cloud/backend && npm ci --ignore-scripts --no-audit --no-fund && npm test
      - name: Test separate builder template
        run: cd cloud/builder-template && npm ci --ignore-scripts --no-audit --no-fund && npm test && python3 -m unittest discover scripts -p 'test_*.py'

  build:
    needs: cloud-template-tests
    # Runner image already ships Gradle; external distribution/CDN downloads returned 504.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # These are public origins baked into the APK, never credentials. Prefer Actions
      # variables; support owners who placed the same public URLs under Actions secrets.
      # Never default SAIF_CLOUD_API_BASE_URL to the static demo portal: when unset or
      # unreachable, SAIF AI compiles APKs directly on-device with zero HTTP 404 errors.
      SAIF_CLOUD_API_BASE_URL: ${{ vars.SAIF_CLOUD_API_BASE_URL || secrets.SAIF_CLOUD_API_BASE_URL || '' }}
      SAIF_DOWNLOAD_PORTAL_URL: ${{ vars.SAIF_DOWNLOAD_PORTAL_URL || secrets.SAIF_DOWNLOAD_PORTAL_URL || 'https://saifai-downloads.ai.studio' }}
      SAIF_FIREBASE_DATABASE_URL: ${{ vars.SAIF_FIREBASE_DATABASE_URL || secrets.SAIF_FIREBASE_DATABASE_URL || 'https://saif-ai-2e541-default-rtdb.firebaseio.com' }}

    steps:
    # Exit code 143 (SIGTERM) in "Build Debug APK" = the runner ran out of memory while dexing.
    # Free disk and add swap BEFORE anything else so the Gradle/Kotlin JVMs are never killed.
    - name: Free disk space and add swap
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY/CodeQL" || true
        sudo swapoff -a || true
        sudo fallocate -l 10G /mnt/swapfile
        sudo chmod 600 /mnt/swapfile
        sudo mkswap /mnt/swapfile
        sudo swapon /mnt/swapfile
        free -m
        df -h / /mnt

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node for safe cloud route preflight
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # This runner image supplies a Gradle binary; all attempted network distribution
    # downloads returned HTTP 504 in CI. Report its version for reproducibility.
    - name: Check preinstalled Gradle
      run: gradle --version

    # SAIF ADVANCE EDITING ENGINE: app/build.gradle.kts runs `go build` for agy_ide_bridge (the local server) during the build.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache-dependency-path: agy_ide_bridge/go.sum

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # Bakes your Telegram asset library into the APK (assets_catalog.json). Never fails the build.
    - name: Snapshot Telegram asset catalog
      continue-on-error: true
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: python3 scripts/telegram_catalog.py

    - name: Check cloud endpoint configuration and deployed gateway routes
      shell: bash
      run: |
        set -euo pipefail
        missing=0
        for key in SAIF_CLOUD_API_BASE_URL SAIF_DOWNLOAD_PORTAL_URL SAIF_FIREBASE_DATABASE_URL; do
          if [[ -z "${!key}" ]]; then
            echo "::warning::$key is not configured. Cloud APK/video jobs will fail closed until the backend is deployed and the app is rebuilt."
            missing=1
          elif [[ "${!key}" != https://* ]]; then
            echo "::error::$key must be an HTTPS URL"
            exit 1
          fi
        done
        # A demo SPA or interactive Google-login redirect must never be treated as a
        # working upload API. This probe sends NO credentials, file bytes or real claims.
        if (( missing == 0 )); then
          node cloud/backend/scripts/check-deployment.mjs || {
            echo "::warning::Cloud preflight check failed; disabling dead SAIF_CLOUD_API_BASE_URL so the APK uses On-Device APK Compilation."
            echo "SAIF_CLOUD_API_BASE_URL=" >> "$GITHUB_ENV"
          }
        fi

    # This one 60 MB compiler JAR redirected from Maven Central to a GitHub release
    # asset that repeatedly returned HTTP 504. Fetch a mirror copy and check its
    # SHA-256 against the official JetBrains release asset digest before using it.
    - name: Verify Kotlin compiler from Maven mirror
      shell: bash
      run: |
        set -euo pipefail
        base=org/jetbrains/kotlin/kotlin-compiler-embeddable/2.3.20
        name=kotlin-compiler-embeddable-2.3.20
        checksum=976f989d0b5f5d80e8e8a8ad4b73da0bfc27fdd965b9fa38362b2be79ecc1337
        repo="$RUNNER_TEMP/saif-verified-maven"
        mkdir -p "$repo/$base"
        curl -fLsS --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 \
          "https://repo.maven.apache.org/maven2/$base/$name.pom" -o "$repo/$base/$name.pom"
        for mirror in \
          https://maven.aliyun.com/repository/central \
          https://mirrors.huaweicloud.com/repository/maven \
          https://mirrors.cloud.tencent.com/nexus/repository/maven-public; do
          echo "Checking signed upstream digest for $name from $mirror"
          if curl -fLsS --retry 2 --retry-delay 2 --connect-timeout 15 --max-time 240 \
            "$mirror/$base/$name.jar" -o "$repo/$base/$name.jar.tmp" && \
            echo "$checksum  $repo/$base/$name.jar.tmp" | sha256sum --check --status; then
            mv "$repo/$base/$name.jar.tmp" "$repo/$base/$name.jar"
            break
          fi
          rm -f "$repo/$base/$name.jar.tmp"
        done
        test -s "$repo/$base/$name.jar" || { echo '::error::Verified compiler download failed'; exit 1; }
        echo "SAIF_VERIFIED_MAVEN_DIR=$repo" >> "$GITHUB_ENV"

    # Two phases so the Kotlin compiler daemon (4 GB) is gone before dexing starts (dexing needs the memory).
    - name: Build Debug APK
      id: build_apk
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      shell: bash
      run: |
        set -o pipefail
        # Memory log every 30 s (printed by the "Memory diagnostics" step if the build fails)
        ( while true; do date +%T; free -m | awk 'NR==2||NR==3'; sleep 30; done ) > /tmp/mem.log 2>&1 &
        # Phase 1: compile Kotlin/Java only
        gradle :app:compileStandardDebugKotlin :app:compileStandardDebugJavaWithJavac --no-daemon --no-configuration-cache 2>&1 | tee /tmp/build.log
        # Free the memory held by the Kotlin compiler daemon before dexing
        pkill -f KotlinCompileDaemon || true
        sleep 3
        free -m
        # Phase 2: dex + package (compile tasks are already up to date)
        gradle assembleDebug --no-daemon --no-configuration-cache 2>&1 | tee -a /tmp/build.log

    - name: Memory diagnostics
      if: failure()
      shell: bash
      run: |
        echo "#### memory log (last 40 lines) ####"; tail -40 /tmp/mem.log || true
        echo "#### kernel OOM killer ####"; sudo dmesg | grep -iE "out of memory|killed process" | tail -10 || true

    # Keeps the compiler errors readable from outside the Actions log viewer:
    # They are published as annotations without modifying another branch.
    - name: Publish compile errors
      if: failure()
      shell: bash
      run: |
        mkdir -p ci-logs
        {
          echo "#### e:/w: LINES ####"
          grep -E "^(e:|w:) " /tmp/build.log || echo "(none)"
          echo
          echo "#### FAILED TASK / SUMMARY ####"
          grep -E "^> Task .*FAILED|^FAILURE:|Execution failed for task|What went wrong|^Caused by:|BUILD FAILED" /tmp/build.log || true
          echo
          echo "#### LAST 250 LINES ####"
          tail -250 /tmp/build.log
        } > ci-logs/compile-errors.txt || true

        python3 - <<'PYEOF' || true
        import os
        p = "ci-logs/compile-errors.txt"
        if not os.path.exists(p):
            raise SystemExit(0)
        text = open(p, encoding="utf-8", errors="replace").read()
        n, size = 10, max(1, (len(text) + 9) // 10)
        for i in range(n):
            chunk = text[i * size:(i + 1) * size]
            if not chunk:
                continue
            esc = chunk.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
            print("::error::PART %d/%d %s" % (i + 1, n, esc))
        PYEOF


    # A failed test must not publish an APK presented as a verified update.
    - name: Run unit tests
      id: unit_tests
      env:
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      shell: bash
      run: |
        set -o pipefail
        gradle testStandardDebugUnitTest --no-daemon --no-configuration-cache 2>&1 | tee /tmp/unit-tests.log

    # The log download host is not available in every developer environment. Put failures into
    # GitHub check annotations so we can fix tests without guessing or silencing the suite.
    - name: Publish test failures
      if: failure() && steps.unit_tests.outcome == 'failure'
      shell: bash
      run: |
        python3 - <<'PYEOF'
        import glob, os, re, xml.etree.ElementTree as ET
        lines = open('/tmp/unit-tests.log', encoding='utf-8', errors='replace').read().splitlines() if os.path.exists('/tmp/unit-tests.log') else []
        # GitHub displays at most ten command annotations per step. Group repeated setup
        # exceptions by cause so a Robolectric failure does not hide unrelated assertions.
        issues = []
        result_dirs = glob.glob('app/build/test-results/*DebugUnitTest')
        for directory in result_dirs:
            for path in glob.glob(os.path.join(directory, 'TEST-*.xml')):
                try:
                    root = ET.parse(path).getroot()
                    for case in root.iter('testcase'):
                        for failure in list(case.findall('failure')) + list(case.findall('error')):
                            detail = (failure.get('message') or failure.text or '').strip().splitlines()[0:1]
                            cause = next((line.strip() for line in (failure.text or '').splitlines()
                                          if line.strip().startswith('Caused by:')), '')
                            reason = re.sub(r'@[0-9a-f]+', '@<id>', f"{' '.join(detail)} {cause}".strip())
                            issues.append((f"{case.get('classname')}.{case.get('name')}", reason))
                except Exception as exc:
                    issues.append((path, f'Could not read XML: {exc}'))
        summaries = [line for line in lines if re.search(r'(^e: |^> Task .*FAILED|^FAILURE:|^\s*\d+ tests? completed|^\s*\S+ > \S+ FAILED|Compilation error|Could not resolve)', line)]
        if issues:
            groups = {}
            for test, reason in issues:
                groups.setdefault(reason, []).append(test)
            messages = [f'{len(issues)} failing tests, {len(groups)} distinct reasons']
            for reason, tests in sorted(groups.items(), key=lambda item: -len(item[1]))[:9]:
                sample = ', '.join(tests[:3]) + (f' (+{len(tests) - 3} more)' if len(tests) > 3 else '')
                messages.append(f'{len(tests)}x {reason[:500]} — {sample}')
        else:
            messages = [f'No test XML failures found in {result_dirs}'] + summaries[:8] + lines[-1:]
        for line in messages[:10]:
            escaped = str(line).replace('%', '%25').replace('\r', '').replace('\n', '%0A')
            print(f'::error::{escaped[:1000]}')
        PYEOF

    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-report
        path: |
          app/build/reports/tests/testStandardDebugUnitTest
          app/build/test-results/testStandardDebugUnitTest
        if-no-files-found: ignore

    - name: Upload APK Artifact
      if: always() && steps.build_apk.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-build-${{ github.run_number }}
        path: app/build/outputs/apk/standard/debug/app-standard-debug.apk

    - name: Stage versioned APK copy for direct download
      if: success()
      shell: bash
      run: |
        cp app/build/outputs/apk/standard/debug/app-standard-debug.apk \
           "app/build/outputs/apk/standard/debug/SAIF-AI-fixed-b${GITHUB_RUN_NUMBER}.apk"

    # The restored startup login also supports local accounts/guest; cloud building stays
    # visibly unavailable until its separate endpoint variables and backend are configured.
    - name: Publish APK to the saif-ai-apk release
      if: success()
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        tag_name: saif-ai-apk
        name: "SAIF AI - debug preview APK"
        body: "Debug preview build #${{ github.run_number }} from commit ${{ github.sha }}. On-Device APK Compiler & Signer enabled."
        prerelease: true
        files: |
          app/build/outputs/apk/standard/debug/app-standard-debug.apk
          app/build/outputs/apk/standard/debug/SAIF-AI-fixed-b${{ github.run_number }}.apk

name: Deploy SAIF AI Gateway to Cloud Run

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - id: set-project
        uses: google-github-actions/set-cloud-project@v1

      - name: Create GCS bucket
        run: |
          BUCKET="saif-ai-staging"
          gsutil ls -b gs://$BUCKET 2>/dev/null || {
            gsutil mb -l asia-south1 -p saif-ai-2e541 gs://$BUCKET
            gsutil versioning set gs://$BUCKET
            echo '{"rule":[{"action":{"type":"Delete"},"condition":{"age":1}}]}' > /tmp/lifecycle.json
            gsutil lifecycle set /tmp/lifecycle.json gs://$BUCKET
            echo "Bucket created: gs://$BUCKET"
          }

      - name: Build and push Docker image
        run: |
          gcloud builds submit --tag gcr.io/saif-ai-2e541/saif-downloads cloud/backend

      - name: Deploy to Cloud Run
        id: deploy
        env:
          FIREBASE_DB_URL: ${{ secrets.FIREBASE_DB_URL }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          DOWNLOAD_SECRET: ${{ secrets.DOWNLOAD_SECRET }}
          WORKER_CALLBACK_SECRET: ${{ secrets.WORKER_CALLBACK_SECRET }}
        run: |
          gcloud run deploy saif-downloads \
            --image gcr.io/saif-ai-2e541/saif-downloads:latest \
            --region asia-south1 \
            --platform managed \
            --timeout 1800 \
            --service-account runtime-sa@saif-ai-2e541.iam.gserviceaccount.com \
            --set-env-vars="PORT=8080,FIREBASE_PROJECT_ID=saif-ai-2e541,FIREBASE_ANDROID_APP_ID=1:41872778254:android:4ff13f3a82b2f552dd885f,FIREBASE_DATABASE_URL=${FIREBASE_DB_URL},STAGING_BUCKET=saif-ai-staging,BUILDER_REPO=shahudgg/SaifAI-Builder,BUILDER_REF=main,BUILDER_WORKFLOW=build.yml,DRIVE_FOLDER_ID=${GDRIVE_FOLDER_ID},DOWNLOAD_SECRET=${DOWNLOAD_SECRET},WORKER_CALLBACK_SECRET=${WORKER_CALLBACK_SECRET}" \
            --set-secrets="GITHUB_DISPATCH_TOKEN=DISPATCH_TOKEN:latest" \
            --allow-unauthenticated

          GATEWAY_URL=$(gcloud run services describe saif-downloads --region asia-south1 --format 'value(status.url)')
          echo "Gateway URL: $GATEWAY_URL"
          echo "GATEWAY_URL=$GATEWAY_URL" >> $GITHUB_OUTPUT

      - name: Verify gateway health
        run: |
          sleep 5
          curl -sf ${{ steps.deploy.outputs.GATEWAY_URL }}/healthz || echo "Health check may need a moment"

      - name: Summary
        run: |
          echo "## Gateway Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Gateway URL:** ${{ steps.deploy.outputs.GATEWAY_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Update AI Studio portal: Set SAIF_CLOUD_API_BASE_URL = ${{ steps.deploy.outputs.GATEWAY_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "2. Set Actions variables in this repo:" >> $GITHUB_STEP_SUMMARY
          echo "   - SAIF_CLOUD_API_BASE_URL = ${{ steps.deploy.outputs.GATEWAY_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "   - SAIF_DOWNLOAD_PORTAL_URL = https://saifai-downloads.ai.studio" >> $GITHUB_STEP_SUMMARY
          echo "   - SAIF_FIREBASE_DATABASE_URL = <your_rtdb_url>" >> $GITHUB_STEP_SUMMARY
          echo "3. Rebuild APK" >> $GITHUB_STEP_SUMMARY
